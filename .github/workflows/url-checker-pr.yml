name: URL Checker (PR)

on: [pull_request]

jobs:
  markdown-link-check:
    # Checks HTTP(S) links in added or modified Markdown files.
    # Checks local file links across all Markdown files.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test link check runner
        run: npm run test:links
      - name: Check links for the pull request
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run check:links -- --base "$BASE_SHA"
