name: URL Checker

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  markdown-link-check:
    # Checks HTTP(S) links over the network and local file links across all Markdown files.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test link check runner
        run: npm run test:links
      - name: Check all links
        run: npm run check:links -- --all
